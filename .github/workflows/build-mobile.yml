name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor native projects
        run: npx cap sync

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Coliflor.apk

      - name: Build iOS App and IPA (Release / Sideloading)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ios/build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ios/build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          fi
          mkdir -p Payload
          cp -r ios/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r Coliflor.ipa Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-binaries
          path: |
            Coliflor.apk
            Coliflor.ipa
          if-no-files-found: error

      - name: Upload to Supabase Public Releases Storage
        run: |
          SUPABASE_URL="https://gamwmifvgfedgfizcxoz.supabase.co"
          SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhbXdtaWZ2Z2ZlZGdmaXpjeG96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODgxODYsImV4cCI6MjEwMzM2NDE4Nn0.7Pc0AGrKNMz6FoWJHQ_CzDV24HMH0aiE0lUP1nrhFnc"

          if [ -f "Coliflor.apk" ]; then
            echo "Uploading Coliflor.apk to Supabase releases bucket..."
            curl -s -X POST \
              "${SUPABASE_URL}/storage/v1/object/releases/Coliflor.apk" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary "@Coliflor.apk" || true
          fi

          if [ -f "Coliflor.ipa" ]; then
            echo "Uploading Coliflor.ipa to Supabase releases bucket..."
            curl -s -X POST \
              "${SUPABASE_URL}/storage/v1/object/releases/Coliflor.ipa" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary "@Coliflor.ipa" || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: "Coliflor Mobile v${{ github.run_number }}"
          body: |
            ## Compilación Móvil de Coliflor 📱🌸

            Nuevas versiones móviles listas para instalar:
            - **Android:** `Coliflor.apk` (Descarga directa e instala en tu Android)
            - **iOS:** `Coliflor.ipa` (Instalación vía sideloading: AltStore, Sideloadly, TrollStore, Scarlet, etc.)

            Generado automáticamente a partir del commit `${{ github.sha }}`.
          files: |
            Coliflor.apk
            Coliflor.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
